            const message = event.data;

            if (message.action === 'push_token') {
                const token = message.text;

                if (message.type === 'think') {
                    // token comes from LLM think
                } else {
                    // token comes from LLM output
                }
            }
        });

        try {
            return chrome.webview.hostObjects.llm_host;
        } catch (ex) {
            console.error("web application is not running on webview2 environment!");
            return null;
        }
    }

    /**
     * js code call webview2 host object SendMessage function
    */
    function SendMessage(prompt_text) {
        if (llm_host) {
            llm_host.SendMessage(prompt_text);
        }
    }

    window.addEventListener("DOMContentLoaded", () => llm_host = addLLMhandler());
